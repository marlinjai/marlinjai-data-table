name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Every package: build, typecheck and unit tests. Until 2026-10-26 only the Prisma adapter was checked, so a
  # change to the react package (useTable's select options, 0.7.1) merged on checks that never ran its tests.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The adapter's typecheck needs its generated client.
      - run: pnpm --filter @marlinjai/data-table-adapter-prisma prisma:generate
      # The packages typecheck against each other's built types.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: data_table_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U test -d data_table_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Disposable database, never credentials for a deployed environment.
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/data_table_test?connection_limit=1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @marlinjai/data-table-adapter-prisma prisma:generate
      - run: pnpm --filter @marlinjai/data-table-core build
      - run: pnpm --filter @marlinjai/data-table-adapter-shared build
      - run: pnpm --filter @marlinjai/data-table-adapter-prisma typecheck
      - run: pnpm --filter @marlinjai/data-table-adapter-prisma test:db
      - run: pnpm --filter @marlinjai/data-table-adapter-prisma build
